# Integración continua: lint + pruebas + auditoría de dependencias en cada PR, y build de las imágenes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest, pip-audit)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_DSN: postgresql+psycopg2://postgres:postgres@localhost:5432/aurora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term --cov-fail-under=90
      - run: pip-audit -r requirements.txt -r requirements-dev.txt

  frontend:
    name: Frontend (lint, typecheck, build, npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  docker:
    name: Imágenes Docker y prueba de humo
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configuración de prueba (secretos desechables)
        run: |
          python3 - <<'PY' > deploy/.env
          import base64, os, secrets
          print("COMPOSE_PROFILES=db")
          print("POSTGRES_PASSWORD=" + secrets.token_urlsafe(24))
          print("SECRET_KEY=" + secrets.token_urlsafe(48))
          print("ENCRYPTION_KEY=" + base64.urlsafe_b64encode(os.urandom(32)).decode())
          print("SITE_ADDRESS=:80")
          print("PUBLIC_URL=http://localhost:8080")
          print("HTTP_PORT=8080")
          PY
      - run: docker compose --env-file deploy/.env config --quiet
      - run: docker compose --env-file deploy/.env build
      - run: docker compose --env-file deploy/.env up -d
      - name: Esperar la API detrás de Caddy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 3
          done
          docker compose --env-file deploy/.env logs
          exit 1
      - name: Encabezados de seguridad del sitio
        run: |
          curl -fsSI http://localhost:8080/ | tee headers.txt
          grep -qi "content-security-policy" headers.txt
          grep -qi "x-frame-options: DENY" headers.txt
      - name: Archivos estáticos del sitio (tema y favicon)
        run: |
          curl -fsS -o /dev/null http://localhost:8080/theme-init.js
          curl -fsS -o /dev/null http://localhost:8080/favicon.png
          curl -fsSI http://localhost:8080/theme-init.js | grep -qi "content-type: text/javascript\|content-type: application/javascript"
      - if: always()
        run: docker compose --env-file deploy/.env down -v
