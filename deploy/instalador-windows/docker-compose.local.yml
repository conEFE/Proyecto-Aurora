# Aurora en un PC con Windows (instalado con AuroraSetup.exe). PostgreSQL + API + sitio en http://localhost:<puerto>.
# Las imágenes se construyen en el PC desde el código incluido en la instalación (carpeta app\).
name: aurora-local

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./app/backend
    image: aurora-local-backend:${AURORA_VERSION:-local}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: postgresql+psycopg2://aurora:${POSTGRES_PASSWORD}@db:5432/aurora
      ROOT_PATH: /api
      ALLOWED_ORIGINS: ${PUBLIC_URL}
    volumes:
      - images:/data/images
    expose:
      - "8000"

  web:
    build: ./app
    image: aurora-local-web:${AURORA_VERSION:-local}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  images:
  caddy_data:
  caddy_config:
