[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "E501"]

[tool.black]
line-length = 110
target-version = ["py310"]
extend-exclude = "venv|alembic/versions"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
